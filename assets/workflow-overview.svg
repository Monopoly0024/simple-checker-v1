<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1030" role="img" aria-labelledby="title desc">
  <title id="title">简单的检查者：从代码输入到图文拆解与验证结果</title>
  <desc id="desc">输入代码和目标，依次拆解职责、解释输入输出和代码位置、检查实际行为、按证据标记状态，生成 HTML 与 Markdown 拆解文件，可选生成完整报告。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#61776b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#193b30" flood-opacity=".08"/>
    </filter>
    <style>
      text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;fill:#20382f}
      .title{font-size:34px;font-weight:700}
      .subtitle{font-size:18px;fill:#5c6e64}
      .column{font-size:15px;font-weight:700;letter-spacing:1.5px;fill:#61776b}
      .card-title{font-size:21px;font-weight:700}
      .body{font-size:17px;fill:#52665c}
      .small{font-size:14px;fill:#5c6e64}
      .step{font-size:13px;font-weight:700;fill:#fff}
      .output-title{font-size:19px;font-weight:700}
      .output-body{font-size:15px;fill:#52665c}
      .number{font-size:14px;font-weight:700;fill:#176549}
      .card{fill:#fff;stroke:#d8e1d9;stroke-width:1.5}
      .flow{fill:none;stroke:#789080;stroke-width:2.4;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect x="0" y="0" width="1440" height="1030" rx="24" fill="#f5f6f1"/>
  <text x="54" y="66" class="title">从代码输入，到看得懂、能复核的结果</text>
  <text x="56" y="102" class="subtitle">简单的检查者 1.1.0 · 解释每块代码，也核实它是否真的完成目标</text>

  <text x="58" y="169" class="column">输入</text>
  <text x="430" y="169" class="column">SKILL 处理流程</text>
  <text x="1086" y="169" class="column">产出</text>

  <g filter="url(#shadow)">
    <rect x="48" y="335" width="300" height="290" rx="18" fill="#e6f1f4" stroke="#96bdc8" stroke-width="1.8"/>
    <circle cx="94" cy="385" r="23" fill="#28748a"/>
    <path d="M83 386l8 8 16-18" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="82" y="438" class="card-title">放入代码与目标</text>
    <text x="82" y="480" class="body">代码文件或项目</text>
    <text x="82" y="510" class="body">希望实现的需求</text>
    <text x="82" y="540" class="body">可选：测试方式与范围</text>
    <rect x="82" y="570" width="224" height="32" rx="16" fill="#d2e7ec"/>
    <text x="98" y="592" class="small">只解释 / 拆解并验证</text>
  </g>

  <path d="M350 480H393" class="flow"/>

  <g filter="url(#shadow)">
    <rect x="420" y="210" width="600" height="142" rx="16" class="card"/>
    <circle cx="464" cy="256" r="22" fill="#dcebdc"/>
    <text x="457" y="262" class="number">01</text>
    <text x="502" y="258" class="card-title">按职责拆成代码板块</text>
    <text x="502" y="294" class="body">找到入口、关键逻辑、数据流与结果输出</text>
    <text x="502" y="324" class="small">不机械逐行分段；结合真实调用关系</text>

    <rect x="420" y="380" width="600" height="142" rx="16" class="card"/>
    <circle cx="464" cy="426" r="22" fill="#e6e8f3"/>
    <text x="457" y="432" class="number">02</text>
    <text x="502" y="428" class="card-title">解释每块的作用和位置</text>
    <text x="502" y="464" class="body">输入 → 处理 → 输出，以及上下游关系</text>
    <text x="502" y="494" class="small">标出文件、函数/类、行号和相关源码</text>

    <rect x="420" y="550" width="600" height="142" rx="16" class="card"/>
    <circle cx="464" cy="596" r="22" fill="#faedcf"/>
    <text x="457" y="602" class="number">03</text>
    <text x="502" y="598" class="card-title">检查功能是否实际起效</text>
    <text x="502" y="634" class="body">运行适用的测试或操作，对照独立预期</text>
    <text x="502" y="664" class="small">记录证据、覆盖范围与未验证部分</text>

    <rect x="420" y="720" width="600" height="142" rx="16" class="card"/>
    <circle cx="464" cy="766" r="22" fill="#f2e2db"/>
    <text x="457" y="772" class="number">04</text>
    <text x="502" y="768" class="card-title">按证据标出状态与问题</text>
    <text x="502" y="804" class="body">把目标、代码位置、观察结果关联起来</text>
    <text x="502" y="834" class="small">局部通过不等于整体目标已完成</text>
  </g>

  <path d="M720 353V372" class="flow"/>
  <path d="M720 523V542" class="flow"/>
  <path d="M720 693V712" class="flow"/>
  <path d="M1022 790H1052V379H1075" class="flow"/>
  <path d="M1052 531H1075" class="flow"/>
  <path d="M1052 683H1075" class="flow"/>

  <g filter="url(#shadow)">
    <rect x="1090" y="254" width="302" height="214" rx="16" fill="#e5f1e8" stroke="#82ae8f" stroke-width="1.8"/>
    <rect x="1110" y="276" width="52" height="27" rx="13" fill="#176549"/>
    <text x="1122" y="295" class="step">默认</text>
    <text x="1112" y="339" class="output-title">HTML 图文拆解</text>
    <text x="1112" y="376" class="output-body">彩色板块图与导航</text>
    <text x="1112" y="404" class="output-body">源码位置、作用与证据</text>
    <text x="1112" y="432" class="output-body">可交互、离线阅读</text>

    <rect x="1090" y="495" width="302" height="166" rx="16" fill="#edf0f7" stroke="#9aa9c2" stroke-width="1.8"/>
    <rect x="1110" y="517" width="52" height="27" rx="13" fill="#445a78"/>
    <text x="1122" y="536" class="step">默认</text>
    <text x="1112" y="580" class="output-title">Markdown 文字版</text>
    <text x="1112" y="617" class="output-body">板块职责、代码位置</text>
    <text x="1112" y="643" class="output-body">检查结论与证据记录</text>

    <rect x="1090" y="688" width="302" height="166" rx="16" fill="#fff3dc" stroke="#d2ad64" stroke-width="1.8"/>
    <rect x="1110" y="710" width="52" height="27" rx="13" fill="#895d12"/>
    <text x="1122" y="729" class="step">可选</text>
    <text x="1112" y="773" class="output-title">完整审查报告</text>
    <text x="1112" y="810" class="output-body">总览 HTML / Markdown</text>
    <text x="1112" y="838" class="output-body">有效 JSON 审查记录</text>
  </g>

  <rect x="50" y="908" width="1340" height="74" rx="14" fill="#fff" stroke="#d8e1d9"/>
  <text x="74" y="941" class="small" style="font-weight:700">状态颜色</text>
  <circle cx="194" cy="937" r="8" fill="#21804e"/><text x="210" y="943" class="small">实际验证通过</text>
  <circle cx="397" cy="937" r="8" fill="#bd3434"/><text x="413" y="943" class="small">确认的问题</text>
  <circle cx="577" cy="937" r="8" fill="#c18a1a"/><text x="593" y="943" class="small">待核实</text>
  <circle cx="716" cy="937" r="8" fill="#858b92"/><text x="732" y="943" class="small">尚未验证</text>
  <text x="74" y="967" class="small">无运行条件时保留未验证；流程图说明处理步骤，不替代真实验证证据。</text>
</svg>
